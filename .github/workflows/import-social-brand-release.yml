name: Verify social and brand release (one-time)
on:
  push:
    branches: [launch/socials-and-brand-downloads]
    paths: [.github/workflows/import-social-brand-release.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/socials-and-brand-downloads
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Import tested source with baseline and content checksums
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          url = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JJ6D4TQlhy7K2sdqOdMKtU625W/5a8c6526-71fe-4388-8b3f-1412f890a4a7.zip'
          with urllib.request.urlopen(url, timeout=45) as response:
              raw = response.read(15000000)
          assert hashlib.sha256(raw).hexdigest() == 'b089c46ffaf754f93652e6c95b93339235c54690633d26404c8afc2a238d5d10'
          allowed = {'.gitignore', 'README.md', 'index.html', 'package.json', 'public/brand/README.txt', 'public/brand/SOCIAL-BIOS.txt', 'public/brand/downloads.json', 'public/brand/palette.json', 'src/App.jsx', 'src/components/SocialLinks.jsx', 'src/data/site.js', 'src/components/BrandKit.jsx', 'src/brand-kit.css', 'scripts/package-brand.mjs', 'qa/check.cjs', 'qa/social-brand.cjs', 'docs/social-brand-validation.json', 'docs/social-link-sources.md'}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              manifest = json.loads(archive.read('manifest.json'))
              assert set(manifest['files']) == allowed
              for name in sorted(allowed):
                  record = manifest['files'][name]
                  dest = pathlib.Path(name)
                  before = hashlib.sha256(dest.read_bytes()).hexdigest() if dest.exists() else None
                  assert before == record['beforeSha256'], f'Concurrent source change: {name}'
                  data = archive.read('source/' + name)
                  assert len(data) == record['bytes'] and len(data) < 100000
                  assert hashlib.sha256(data).hexdigest() == record['sha256'], name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
              evidence = pathlib.Path('/tmp/social-brand-evidence')
              evidence.mkdir(exist_ok=True)
              for name in ('social-footer.png', 'brand-library-desktop.png', 'brand-library-phone.png', 'phone-home.png', 'phone-contact.png', 'phone-aegis-detail.png', 'desktop-home.png', 'social-brand-results.json', 'dependency-audit.json'):
                  (evidence / name).write_bytes(archive.read('evidence/' + name))
          PY
      - name: Install locked dependencies and build
        run: |
          npm ci --no-fund
          npm audit --audit-level=high
          npm run build
      - name: Verify downloadable archive and original scene bytes
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('public/art')
          manifest = json.loads((root / 'provenance.json').read_text())
          for name, expected in manifest['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected['sha256'], name
          with zipfile.ZipFile('dist/brand/zicotix-brand-kit.zip') as archive:
              assert archive.testzip() is None
              assert len(archive.namelist()) == 21
              for name in archive.namelist():
                  assert name.startswith('zicotix-brand-kit/')
                  assert pathlib.Path(name).suffix in ('.png', '.jpg', '.svg', '.json', '.txt')
          print('Original scenes unchanged and all 21 brand-kit files verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: social-brand-browser-evidence
          path: /tmp/social-brand-evidence/
          retention-days: 7
      - name: Commit only this tested launch pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore README.md index.html package.json public/brand/README.txt public/brand/SOCIAL-BIOS.txt public/brand/downloads.json public/brand/palette.json src/App.jsx src/components/SocialLinks.jsx src/data/site.js src/components/BrandKit.jsx src/brand-kit.css scripts/package-brand.mjs qa/check.cjs qa/social-brand.cjs docs/social-brand-validation.json docs/social-link-sources.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add all social buttons, accessible brand downloads and reproducible ZIP'
            git push origin HEAD:launch/socials-and-brand-downloads
          fi
