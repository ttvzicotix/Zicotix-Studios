name: Import brand format exports (one-time)
on:
  push:
    branches: [launch/socials-and-brand-downloads]
    paths: [.github/workflows/import-brand-exports.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/socials-and-brand-downloads
      - name: Import approved format conversions only
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          url = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JJ6D4TQlhy7K2sdqOdMKtU625W/9e67fdf8-d1da-4b95-b9a4-a7215ef3f7a1.zip'
          with urllib.request.urlopen(url, timeout=40) as response:
              raw = response.read(4000000)
          assert hashlib.sha256(raw).hexdigest() == '8cb658ef2e3c6e54f46c6f8a7622cb72ad7553004e2fd7612f9e2c5ee74b5306', 'Archive checksum mismatch'
          root = pathlib.Path('public/brand')
          allowed = {'zicotix-profile-1024.jpg', 'zicotix-youtube-banner-2560x1440.jpg', 'zicotix-wide-banner-1500x500.jpg', 'zicotix-social-preview-1200x630.jpg', 'zicotix-logo-white-on-dark.jpg', 'zicotix-logo-purple-on-white.jpg', 'zicotix-apple-touch-icon.png', 'zicotix-favicon-32.png', 'previews/zicotix-profile-1024.webp', 'previews/zicotix-youtube-banner-2560x1440.webp', 'previews/zicotix-wide-banner-1500x500.webp', 'previews/zicotix-social-preview-1200x630.webp'}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              manifest = json.loads(archive.read('export-provenance.json'))
              assert set(manifest['files']) == allowed
              for name in sorted(allowed):
                  data = archive.read(name)
                  expected = manifest['files'][name]
                  assert len(data) == expected['bytes'] and len(data) < 1000000
                  assert hashlib.sha256(data).hexdigest() == expected['sha256']
                  out = root / name
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)
              (root / 'export-provenance.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Commit the exported assets on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/brand
          if ! git diff --cached --quiet; then
            git commit -m 'Add JPEG, thumbnail and phone-icon variants of approved branding'
            git push origin HEAD:launch/socials-and-brand-downloads
          fi
