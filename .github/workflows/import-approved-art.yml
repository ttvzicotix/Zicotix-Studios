name: Import approved artwork (one-time)
on:
  push:
    branches: [visual/restore-approved-art]
    paths: [.github/workflows/import-approved-art.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/restore-approved-art
      - name: Copy only approved image bytes from verified archive
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          url = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JJ6D4TQlhy7K2sdqOdMKtU625W/a10800ec-a366-4f9d-b64f-10bd8e4c2166.zip'
          expected = '00f048474cda2d7037ca4266255a99fe024858340a76e318b6b6ba69ed6ba9da'
          with urllib.request.urlopen(url, timeout=30) as response:
              archive = response.read(1000000)
          assert hashlib.sha256(archive).hexdigest() == expected, 'Approved archive checksum mismatch'
          destination = pathlib.Path('public/art')
          destination.mkdir(parents=True, exist_ok=True)
          manifest = {'source': 'Previously approved Zicotix portfolio v2 artwork; no regeneration or screenshot crops', 'archive_sha256': expected, 'files': {}}
          with zipfile.ZipFile(io.BytesIO(archive)) as package:
              for name in ('hero', 'aegis', 'optima', 'about'):
                  content = package.read(f'zicotix-portfolio/assets/{name}-art.webp')
                  assert len(content) < 1000000 and content[:4] == b'RIFF' and content[8:12] == b'WEBP', 'Unexpected image format'
                  filename = f'{name}.webp'
                  (destination / filename).write_bytes(content)
                  manifest['files'][filename] = {'sha256': hashlib.sha256(content).hexdigest(), 'bytes': len(content)}
          (destination / 'provenance.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Commit the four static images to this restoration branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/art/hero.webp public/art/aegis.webp public/art/optima.webp public/art/about.webp public/art/provenance.json
          if ! git diff --cached --quiet; then
            git commit -m 'Restore the exact approved hero, Aegis, Optima and About artwork'
            git push origin HEAD:visual/restore-approved-art
          fi
