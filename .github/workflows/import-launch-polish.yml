name: Import reviewed launch polish (one-time)
on:
  push:
    branches: [launch/project-details-contact-brand-kit]
    paths: [.github/workflows/import-launch-polish.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/project-details-contact-brand-kit
          fetch-depth: 2
      - name: Retrieve and validate the reviewed patch
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, subprocess, urllib.request, zipfile
          expected_base = '5abdbdeba673bc1deb79fb3f103f9cbd71696c0f'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == expected_base, 'Branch changed; review before importing'
          url = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JJ6D4TQlhy7K2sdqOdMKtU625W/65f16628-9fe3-4369-b069-d5f293579b29.zip'
          digest = '7a7634c20630ee9c30590afc7fee9145325bd06ed9e20750536c921afb19e140'
          with urllib.request.urlopen(url,timeout=45) as response:
              raw = response.read(16000001)
          assert len(raw) < 16000000 and hashlib.sha256(raw).hexdigest() == digest, 'Archive checksum mismatch'
          allowed = {'README.md','index.html','src/App.jsx','src/polish.css','src/data/site.js','src/lib/contact.js','src/components/Dialog.jsx','src/components/ProjectDetails.jsx','src/components/SocialLinks.jsx','src/components/ContactForm.jsx','src/components/StudioDetails.jsx','src/components/FAQ.jsx','public/brand/zicotix-logo-white-transparent.png','public/brand/zicotix-logo-purple-transparent.png','public/brand/zicotix-logo.svg','public/brand/zicotix-profile-1024.png','public/brand/zicotix-youtube-banner-2560x1440.png','public/brand/zicotix-wide-banner-1500x500.png','public/brand/zicotix-social-preview-1200x630.png','public/brand/manifest.json','public/brand/README.txt','qa/check.cjs','scripts/export-brand.cjs','docs/launch-polish-validation.json'}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['base_commit'] == expected_base
              assert set(manifest['files']) == allowed, 'Unexpected source path'
              for name, expected in manifest['files'].items():
                  data = archive.read('source/' + name)
                  assert len(data) < 6000000 and hashlib.sha256(data).hexdigest() == expected
                  path = pathlib.Path(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
          pathlib.Path('/tmp/zicotix-launch-polish-reviewed.zip').write_bytes(raw)
          print('Imported reviewed source and images only. Form delivery remains unverified.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate production build
        run: npm ci --no-fund && npm audit --audit-level=high && npm run build
      - name: Store source, PNG exports and screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: zicotix-launch-polish-reviewed
          path: /tmp/zicotix-launch-polish-reviewed.zip
          retention-days: 14
      - name: Commit the reviewed patch to the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md index.html src public/brand qa/check.cjs scripts/export-brand.cjs docs/launch-polish-validation.json
          git commit -m 'Add project details, in-page contact, mobile polish and exact brand exports'
          git push origin HEAD:launch/project-details-contact-brand-kit
